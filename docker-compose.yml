services:
  postgis:
    build:
      context: ./infra/postgis
      dockerfile: Dockerfile
    container_name: dc_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-dc_india}
      POSTGRES_USER: ${PG_USER:-dc}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-dc_dev_pw_change_me}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgis/migrations:/migrations:ro
      - ./infra/tuning/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-dc} -d ${PG_DB:-dc_india}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dc_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  postgres-data:
