services:
  postgis:
    build:
      context: ./infra/postgis
      dockerfile: Dockerfile
    container_name: dc_postgis
    restart: unless-stopped
    # Docker's default /dev/shm is 64 MB. Postgres uses /dev/shm for
    # parallel workers' shared hash tables; the UI's 3-way join on the
    # 600k-row scores/features/cells tables blows past 64 MB and surfaces
    # as a misleading "DiskFull: could not resize shared memory segment".
    # 2 GB is conservative — bump if you raise max_parallel_workers_per_gather.
    shm_size: 2gb
    environment:
      POSTGRES_DB: ${PG_DB:-dc_india}
      POSTGRES_USER: ${PG_USER:-dc}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-dc_dev_pw_change_me}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgis/migrations:/migrations:ro
      - ./infra/tuning/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-dc} -d ${PG_DB:-dc_india}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dc_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgis:
        condition: service_healthy

  # FalkorDB: Redis-protocol property graph. Source of truth stays in
  # postgis; the graph is a derived/queryable projection rebuilt via
  # `dc graph rebuild` and updated incrementally by ingestion hooks.
  # Port 3000 exposes the FalkorDB Workbench UI for ad-hoc Cypher.
  falkordb:
    image: falkordb/falkordb:latest
    container_name: dc_falkordb
    restart: unless-stopped
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "3000:3000"
    volumes:
      - falkordb-data:/data
    command:
      - "--save"
      - "60"
      - "1000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  falkordb-data:
