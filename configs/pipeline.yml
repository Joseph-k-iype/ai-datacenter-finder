# Global pipeline configuration. Loaded by app/core/config.py.
# Override fields via .env (PIPELINE_*) or by editing this file.

india:
  # Bounding box covering mainland + Andaman & Nicobar.
  # (min_lon, min_lat, max_lon, max_lat) EPSG:4326
  bbox: [68.0, 6.5, 97.5, 37.5]
  gadm_url: "https://geodata.ucdavis.edu/gadm/gadm4.1/json/gadm41_IND_1.json"

resolutions:
  exclusion: 6        # coarse first sweep
  scoring:   7        # main scoring resolution
  drilldown: 8        # only for top-N res-7 cells

# Average H3 cell area (km²) per resolution. Source: H3 documentation.
# Used by population.py to compute density from total. Values from
# https://h3geo.org/docs/core-library/restable.
h3_avg_area_km2:
  6: 36.129
  7: 5.161
  8: 0.737

gee:
  # Asset IDs / sources
  india_h3_asset: "projects/{project}/assets/dc_india/h3_cells_res7"
  layers:
    seismic:    "projects/{project}/assets/nasa_gshap_pga"   # uploaded once
    flood:      "JRC/GSW1_4/GlobalSurfaceWater"
    slope:      "USGS/SRTMGL1_003"
    landcover:  "ESA/WorldCover/v200"
    solar:      "projects/{project}/assets/global_solar_atlas_pvout"
    climate:    "ECMWF/ERA5_LAND/MONTHLY_AGGR"
    population: "WorldPop/GP/100m/pop"
    wdpa:       "WCMC/WDPA/current/polygons"

  # Reducer scale per layer (meters). Match the native resolution to avoid blur.
  scale_m:
    seismic:    1000
    flood:      30
    slope:      30
    landcover:  10
    solar:      250
    climate:    11132   # ERA5-Land native ~0.1°
    population: 100

  # Aggregation windows (year ranges or single years). Update annually.
  windows:
    climate:
      start_date: "2023-01-01"
      end_date:   "2024-01-01"
    population:
      year: 2020
      country_iso3: "IND"

  export:
    # Cells per reduceRegions call. Larger chunks amortise the per-request
    # fixed cost (~1-2s of auth + scheduling) over more cells. At res-7
    # the inline FeatureCollection for 5000 hexagons is ~2.5 MB JSON,
    # comfortably under GEE's 10 MB request cap.
    chunk_size: 5000
    # Parallel chunk workers per layer. GEE's reduceRegions.getInfo() is a
    # blocking HTTP call that releases the GIL — threads are the right
    # primitive (see app/ingest/gee/zonal_export.py for the "why not asyncio"
    # rationale). 10 is safe for free-tier accounts on the public EE
    # endpoint; raise to 16-20 on paid Cloud-EE quotas, lower to 2-3 if you
    # see 429 rate-limit errors.
    max_workers: 10
    # When `dc ingest gee-all --parallel-layers N` is used, N layers run
    # concurrently. Each still uses its own max_workers pool, so total
    # in-flight HTTP calls = N × max_workers — beware GEE quotas.
    layer_parallelism: 1
    tile_scale: 4          # raise to 8 or 16 on "Computed value too large"

ingestion:
  # Idempotency: if a source has a successful ingestion_runs row whose
  # finished_at is within this window, the next call skips immediately.
  # Bypass per-call with `dc ingest ... --fresh` or `make ingest-fresh-all`.
  skip_ttl_hours: 24

osm:
  # Voltage thresholds for HV transmission ingest. OSM voltage tag is in volts;
  # values in this list are kV. The lowest entry is the inclusion threshold.
  hv_voltage_kv: [220, 400, 765, 800]

overpass:
  retries: 5
  backoff_seconds: [5, 15, 30, 60, 120]
  state_chunks: true

exclusions:
  # Hard mask thresholds (see configs/exclusions.yml for the canonical copy)
  use_file: "configs/exclusions.yml"

scoring:
  default_weights_file: "configs/weights/default.yml"
  diversity_min_km: 50.0
  top_n_per_state: 5
  distance_cap_km: 500.0   # all KNN distance features clamp here

# Feature-computation parallelism. The redundancy pass (two LATERAL KNN
# lookups per cell) is the longest in the features stage; chunking by
# state_code into N concurrent connections multiplies the GiST-index
# parallelism inside each query.
features:
  redundancy:
    # How many states to process concurrently. Cap at engine pool_size+overflow.
    parallel_states: 6
    # Postgres workers per query (set via SET LOCAL inside the session).
    # Total in-flight workers ≈ parallel_states × pg_workers_per_query.
    pg_workers_per_query: 4
  distances:
    parallel_states: 6
    pg_workers_per_query: 4

# FalkorDB knowledge-graph projection tunables. The graph is rebuildable
# from Postgres via `dc graph rebuild`.
graph:
  # UNWIND batch size for all MERGE projectors. 5,000 is the measured
  # sweet spot for pan-India res-7 (~600k cells × ~16 properties).
  # FalkorDB serializes writes server-side so the bottleneck is server
  # planning per query, not network. Larger batches amortize planner
  # overhead; >10k hits Redis inline-arg limits intermittently.
  batch_size: 5000
  # Run different-label projectors concurrently. In theory safe because
  # each phase writes to disjoint node labels (cells → Cell/State/...,
  # lineage → IngestionRun/SchemaContract/...), but FalkorDB 8.6.x
  # segfaults inside EnforceUniqueEntity when concurrent MERGEs hit
  # unique constraints on different labels at the same time. Default
  # to 1 (serial) until that's fixed upstream; raise to 3 on a patched
  # build for the measured ~20-30% wall-time gain.
  rebuild_workers: 1

# Topology-build parameters (sub-grid component labeling). Production
# deployments may tune the snap radius based on local substation density.
power_topology:
  parallel_cluster_eps_deg: 0.0045   # ~500 m at the equator
  substation_snap_km: 1.0
  substation_snap_deg: 0.009         # spatial-index pre-filter radius

# Data-quality row-count expectations. Trigger warnings outside these bounds.
# Bounds reflect motorway + trunk for highways (~150k rows); the original
# 100k upper bound was for motorway-only.
dq_row_count_bounds:
  h3_cells_res6:    [60000, 200000]
  h3_cells_res7:    [400000, 1500000]
  raw_power_lines:  [5000, 200000]
  raw_highways:     [1000, 250000]
  raw_water_bodies: [1000, 500000]
