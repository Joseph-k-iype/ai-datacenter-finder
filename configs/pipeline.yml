# Global pipeline configuration. Loaded by app/core/config.py.
# Override fields via .env (PIPELINE_*) or by editing this file.

india:
  # Bounding box covering mainland + Andaman & Nicobar.
  # (min_lon, min_lat, max_lon, max_lat) EPSG:4326
  bbox: [68.0, 6.5, 97.5, 37.5]
  gadm_url: "https://geodata.ucdavis.edu/gadm/gadm4.1/json/gadm41_IND_1.json"

resolutions:
  exclusion: 6        # coarse first sweep
  scoring:   7        # main scoring resolution
  drilldown: 8        # only for top-N res-7 cells

# Average H3 cell area (km²) per resolution. Source: H3 documentation.
# Used by population.py to compute density from total. Values from
# https://h3geo.org/docs/core-library/restable.
h3_avg_area_km2:
  6: 36.129
  7: 5.161
  8: 0.737

gee:
  # Asset IDs / sources
  india_h3_asset: "projects/{project}/assets/dc_india/h3_cells_res7"
  layers:
    seismic:    "projects/{project}/assets/nasa_gshap_pga"   # uploaded once
    flood:      "JRC/GSW1_4/GlobalSurfaceWater"
    slope:      "USGS/SRTMGL1_003"
    landcover:  "ESA/WorldCover/v200"
    solar:      "projects/{project}/assets/global_solar_atlas_pvout"
    climate:    "ECMWF/ERA5_LAND/MONTHLY"
    population: "WorldPop/GP/100m/pop"
    wdpa:       "WCMC/WDPA/current/polygons"

  # Reducer scale per layer (meters). Match the native resolution to avoid blur.
  scale_m:
    seismic:    1000
    flood:      30
    slope:      30
    landcover:  10
    solar:      250
    climate:    11132   # ERA5-Land native ~0.1°
    population: 100

  # Aggregation windows (year ranges or single years). Update annually.
  windows:
    climate:
      start_date: "2023-01-01"
      end_date:   "2024-01-01"
    population:
      year: 2020
      country_iso3: "IND"

  export:
    # Cells per synchronous reduceRegions call. Keep small enough that
    # the inline FeatureCollection payload stays under the 10 MB request
    # cap. 2000 is a safe default for res-7 hexagons; raise for cheap
    # reducers (mean only) or lower for heavy reducers (combine+percentile).
    chunk_size: 2000
    tile_scale: 4          # raise to 8 or 16 on "Computed value too large"

osm:
  # Voltage thresholds for HV transmission ingest. OSM voltage tag is in volts;
  # values in this list are kV. The lowest entry is the inclusion threshold.
  hv_voltage_kv: [220, 400, 765, 800]

overpass:
  retries: 5
  backoff_seconds: [5, 15, 30, 60, 120]
  state_chunks: true

exclusions:
  # Hard mask thresholds (see configs/exclusions.yml for the canonical copy)
  use_file: "configs/exclusions.yml"

scoring:
  default_weights_file: "configs/weights/default.yml"
  diversity_min_km: 50.0
  top_n_per_state: 5
  distance_cap_km: 500.0   # all KNN distance features clamp here

# Topology-build parameters (sub-grid component labeling). Production
# deployments may tune the snap radius based on local substation density.
power_topology:
  parallel_cluster_eps_deg: 0.0045   # ~500 m at the equator
  substation_snap_km: 1.0
  substation_snap_deg: 0.009         # spatial-index pre-filter radius

# Data-quality row-count expectations. Trigger warnings outside these bounds.
dq_row_count_bounds:
  h3_cells_res6:    [60000, 200000]
  h3_cells_res7:    [400000, 1500000]
  raw_power_lines:  [5000, 200000]
  raw_highways:     [1000, 100000]
  raw_water_bodies: [1000, 500000]
