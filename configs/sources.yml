# Canonical URIs + queries for all external data sources.
# Edit here, not in code; ingest adapters resolve names against this file.

gadm:
  india_l1_states:
    url: "https://geodata.ucdavis.edu/gadm/gadm4.1/json/gadm41_IND_1.json"
    license: "GADM Free for academic and other non-commercial use"

osm_overpass:
  power_lines_hv:
    query: |
      [out:json][timeout:{timeout}];
      area["ISO3166-1"="IN"][admin_level=2]->.in;
      (
        way["power"="line"]["voltage"~"^(220|400|765|800)"](area.in);
        way["power"="line"]["voltage"~"^[0-9]+$"](if: number(t["voltage"]) >= 220000)(area.in);
      );
      out body geom;
  substations_hv:
    query: |
      [out:json][timeout:{timeout}];
      area["ISO3166-1"="IN"][admin_level=2]->.in;
      (
        node["power"="substation"]["voltage"~"^(220|400|765|800)"](area.in);
        way["power"="substation"]["voltage"~"^(220|400|765|800)"](area.in);
      );
      out center body;
  highways:
    query: |
      [out:json][timeout:{timeout}];
      area["ISO3166-1"="IN"][admin_level=2]->.in;
      (
        way["highway"~"^(motorway|trunk)$"](area.in);
      );
      out body geom;
  railways:
    query: |
      [out:json][timeout:{timeout}];
      area["ISO3166-1"="IN"][admin_level=2]->.in;
      way["railway"="rail"]["service"!~"."](area.in);
      out body geom;
  water_bodies:
    query: |
      [out:json][timeout:{timeout}];
      area["ISO3166-1"="IN"][admin_level=2]->.in;
      (
        relation["natural"="water"](area.in);
        way["natural"="water"](area.in);
        way["waterway"="river"](area.in);
      );
      out body geom;
  sez:
    # Special Economic Zones. OSM tagging here is inconsistent; we union
    # the canonical `boundary=special_economic_zone` with industrial land
    # parcels whose name contains "SEZ" (common Indian convention).
    query: |
      [out:json][timeout:{timeout}];
      area["ISO3166-1"="IN"][admin_level=2]->.in;
      (
        relation["boundary"="special_economic_zone"](area.in);
        way["boundary"="special_economic_zone"](area.in);
        relation["landuse"="industrial"]["name"~"SEZ|Special Economic",i](area.in);
        way["landuse"="industrial"]["name"~"SEZ|Special Economic",i](area.in);
        way["place"="industrial"]["name"~"SEZ|Special Economic",i](area.in);
      );
      out center body geom;
  data_centers:
    # Existing hyperscaler footprint. The tag landscape is messy — pulls
    # any feature OSM has flagged as a data center, plus telco buildings
    # whose name strongly suggests one.
    query: |
      [out:json][timeout:{timeout}];
      area["ISO3166-1"="IN"][admin_level=2]->.in;
      (
        node["telecom"="data_center"](area.in);
        way["telecom"="data_center"](area.in);
        node["office"="data_center"](area.in);
        way["office"="data_center"](area.in);
        node["building"="data_center"](area.in);
        way["building"="data_center"](area.in);
        node["industrial"~"telecommunication|data_center"](area.in);
        way["industrial"~"telecommunication|data_center"](area.in);
        node["name"~"data ?cent(er|re)",i]["amenity"!="library"](area.in);
        way["name"~"data ?cent(er|re)",i]["amenity"!="library"](area.in);
      );
      out center body;

wdpa:
  india_subset:
    source: "WCMC/WDPA/current/polygons"   # via GEE; filter ISO3 = 'IND'
    license: "UNEP-WCMC and IUCN, Protected Planet"

