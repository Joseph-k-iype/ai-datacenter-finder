[project]
name = "ai-data-center"
version = "0.1.0"
description = "Pan-India AI data center site selection PoC"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # CLI + config
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",

    # Spatial / geo
    "h3>=4.1.0",
    "geopandas>=0.14.3",
    "shapely>=2.0.3",
    "pyproj>=3.6.1",
    "rasterio>=1.3.9",
    "fiona>=1.9.5",

    # Earth Engine + GCS
    "earthengine-api>=0.1.395",
    "gcsfs>=2024.3.1",
    "google-cloud-storage>=2.16.0",

    # OSM
    "osmnx>=1.9.2",
    "overpy>=0.7",
    "networkx>=3.2.1",

    # Data
    "pandas>=2.2.1",
    "polars>=0.20.16",
    "pyarrow>=15.0.2",
    "duckdb>=0.10.1",
    "pandera>=0.18.0",
    "numpy>=1.26.4",

    # DB
    "sqlalchemy>=2.0.29",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",

    # UI
    "streamlit>=1.32.2",
    "pydeck>=0.8.0",
    "plotly>=5.20.0",

    # Misc
    "tenacity>=8.2.3",
    "requests>=2.31.0",
    "tqdm>=4.66.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.4.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "ipykernel>=6.29.4",
    "jupyter>=1.0.0",
]

[project.scripts]
dc = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length — handled by formatter
    "B008",   # typer.Option in defaults — idiomatic Typer pattern
    "N806",   # uppercase locals — used for math conventions (G=graph, R=Earth radius)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires postgres testcontainer",
    "gee: requires Google Earth Engine credentials",
    "slow: takes > 30s",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
