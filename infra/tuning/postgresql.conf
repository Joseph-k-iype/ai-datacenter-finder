# PostgreSQL tuning for spatial workloads on a developer laptop / single-node host.
# Adjust shared_buffers / work_mem upward on a bigger box.

listen_addresses = '*'
max_connections = 100

shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 64MB
maintenance_work_mem = 512MB

# WAL / checkpoints — favor batch ingest over OLTP latency.
wal_level = replica
checkpoint_timeout = 15min
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# Planner / parallel
random_page_cost = 1.1
effective_io_concurrency = 200
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# JIT — useful for big spatial joins, costs nothing if PG decides not to use it.
jit = on

# Logging
log_min_duration_statement = 1000
log_lock_waits = on
log_temp_files = 0
log_timezone = 'UTC'
timezone = 'UTC'
